concurrency:
  group: bmz-ai-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

name: BMZ AI Android Build

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Public HTTPS BMZ AI backend URL"
        required: false
        type: string
        default: "https://bmz-ai-backend.onrender.com"
  repository_dispatch:
    types: [bmz_android_build]
  push:
    paths:
      - 'templates/android/**'
      - 'app/**'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - '.github/workflows/android-build.yml'
      - 'mobile/**'
      - 'shared/**'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Select Android project
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "dir=templates/android" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare template Gradle files
        if: steps.project.outputs.dir == 'templates/android'
        working-directory: templates/android
        run: |
          base64 -d root.gradle.b64 > build.gradle
          base64 -d app/build.gradle.b64 > app/build.gradle
      - name: Install Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bmz-ai-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk

  mobile-android:
    name: Build BMZ AI standalone Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure mobile API endpoint
        env:
          API_URL: ${{ inputs.api_url || vars.BMZ_API_URL || 'https://bmz-ai-backend.onrender.com' }}
        run: |
          case "$API_URL" in
            https://*) ;;
            *) echo "api_url must use HTTPS"; exit 1 ;;
          esac
          printf 'EXPO_PUBLIC_API_URL=%s\n' "$API_URL" > .env.production.local
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Diagnose Expo project
        run: |
          npx expo-doctor || echo "::warning::Expo Doctor reported diagnostics; production bundle validation below remains mandatory."
      - name: Validate TypeScript
        run: npx tsc --noEmit
      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android --clean
      - name: Validate production JavaScript bundle
        run: npx expo export --platform android --output-dir .expo-export
      - name: Install Android SDK
        working-directory: mobile
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: bmz-ai-gradle-release-${{ runner.os }}-${{ hashFiles('mobile/package.json', 'mobile/android/**/*.gradle*', 'mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            bmz-ai-gradle-release-${{ runner.os }}-
      - name: Configure test signing for installable release APK
        working-directory: mobile
        shell: python
        run: |
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "buildTypes {"
          if marker not in s:
              raise SystemExit("buildTypes block not found")
          head, tail = s.split(marker, 1)
          release = "release {"
          if release not in tail:
              raise SystemExit("release build type not found")
          tail = tail.replace(release, 'release {\n            // Test-only signing so the CI APK can be installed directly.\n            signingConfig signingConfigs.debug', 1)
          p.write_text(head + marker + tail)
      - name: Build standalone signed release APK
        working-directory: mobile/android
        timeout-minutes: 25
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g\ -XX:MaxMetaspaceSize=1g
        run: chmod +x gradlew && ./gradlew --no-daemon --max-workers=2 :app:assembleRelease --stacktrace --console=plain
      - name: Verify APK is standalone and signed
        working-directory: mobile
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -l "$APK" | grep -Eq 'assets/index.android.bundle|assets/index.android.bundle.hbc|assets/.+\.hbc'
      - name: Upload standalone BMZ AI APK
        uses: actions/upload-artifact@v4
        with:
          name: bmz-ai-standalone-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
