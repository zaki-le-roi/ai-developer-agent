name: BMZ AI Android Build

on:
  workflow_dispatch:
  repository_dispatch:
    types: [bmz_android_build]
  push:
    paths:
      - 'templates/android/**'
      - 'app/**'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - '.github/workflows/android-build.yml'
      - 'mobile/**'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Select Android project
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "dir=templates/android" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare template Gradle files
        if: steps.project.outputs.dir == 'templates/android'
        working-directory: templates/android
        run: |
          base64 -d root.gradle.b64 > build.gradle
          base64 -d app/build.gradle.b64 > app/build.gradle
      - name: Install Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bmz-ai-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk


  mobile-android:
    name: Build BMZ AI mobile APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install mobile dependencies
        run: npm install
      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android
      - name: Install Android SDK
        working-directory: mobile
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build BMZ AI APK
        working-directory: mobile/android
        run: gradle --no-daemon assembleDebug
      - name: Upload BMZ AI mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: bmz-ai-mobile-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
