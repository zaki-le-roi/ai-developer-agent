name: BMZ AI Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'templates/android/**'
      - '.github/workflows/android-build.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gradle files
        run: |
          base64 -d root.gradle.b64 > build.gradle
          base64 -d app/build.gradle.b64 > app/build.gradle
      - name: Install Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bmz-ai-debug-apk
          path: templates/android/app/build/outputs/apk/debug/app-debug.apk
