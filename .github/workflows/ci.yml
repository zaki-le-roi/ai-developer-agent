concurrency:
  group: bmz-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: BMZ AI CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'mobile/**'
      - 'shared/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'mobile/**'
      - 'shared/**'
      - '.github/workflows/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - run: npm run build
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json
      - run: npm install
      - run: npx tsc --noEmit
